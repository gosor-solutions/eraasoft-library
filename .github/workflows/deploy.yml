name: Deploy to Hostinger Staging

on:
  push:
    branches:
      - tarek-knowledge

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: tarek-knowledge # Specifies the environment to use

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:production
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Rename index.html to index.php
        run: mv ./dist/index.html ./dist/index.php

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          TARGET: /home/u257846429/domains/eknowledge.ps/public_html/
          SOURCE: ./dist/
